<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Stand-ins for the Windows fonts in lab documents. Latin ones keep the
     same widths (Carlito, Liberation); CJK glyphs are all one em wide, so
     any CJK stand-in keeps line breaks. -->
<fontconfig>
  <alias binding="same"><family>Calibri</family><accept><family>Carlito</family></accept></alias>
  <alias binding="same"><family>Cambria</family><accept><family>Caladea</family></accept></alias>
  <alias binding="same"><family>Times New Roman</family><accept><family>Liberation Serif</family></accept></alias>
  <alias binding="same"><family>Arial</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>Helvetica</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>Courier New</family><accept><family>Liberation Mono</family></accept></alias>
  <alias binding="same"><family>標楷體</family><accept><family>AR PL UKai TW</family></accept></alias>
  <alias binding="same"><family>DFKai-SB</family><accept><family>AR PL UKai TW</family></accept></alias>
  <alias binding="same"><family>BiauKai</family><accept><family>AR PL UKai TW</family></accept></alias>
  <alias binding="same"><family>新細明體</family><accept><family>AR PL UMing TW</family></accept></alias>
  <alias binding="same"><family>PMingLiU</family><accept><family>AR PL UMing TW</family></accept></alias>
  <alias binding="same"><family>細明體</family><accept><family>AR PL UMing TW</family></accept></alias>
  <alias binding="same"><family>MingLiU</family><accept><family>AR PL UMing TW</family></accept></alias>
  <alias binding="same"><family>微軟正黑體</family><accept><family>Noto Sans CJK TC</family></accept></alias>
  <alias binding="same"><family>Microsoft JhengHei</family><accept><family>Noto Sans CJK TC</family></accept></alias>
  <alias binding="same"><family>Microsoft JhengHei UI</family><accept><family>Noto Sans CJK TC</family></accept></alias>
</fontconfig>
